# Parameters for building the task data. Every builder is deterministic given
# this file, the raw sources cached under data/raw/, and the pinned source archive.

seed: 20260914

strategyqa:
  url: https://storage.googleapis.com/ai2i/strategyqa/data/strategyqa_dataset.zip

prontoqa:
  source: official_v1_archive
  archive: data/raw/prontoqa/model_outputs_v1.zip
  archive_sha256: a008e2ae8cade925e01adfe1d3a9b6ed59e2ca887689f37ea25e0fd8e85601dd
  hops: [1, 3, 5]
  expected_trials_per_hop: 400  # keep every author-labelled test trial
  members:
    1:
      name: gpt_textdavinci002_1hop.log
      sha256: e0e854d4d17baaa7f61018e366182a238ed59215165b19bdeb58ff802e4e1714
    3:
