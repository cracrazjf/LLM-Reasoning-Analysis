comparison:
  # Pairwise magnitude comparison built from Wikidata, following Lehmann et al.
  # (EACL 2026) but re-binned by log10 value ratio so difficulty is controlled.
  user_agent: "LLM-Reasoning-Analysis/0.1 (research; contact via GitHub)"
  max_entities_per_attribute: 1000     # top entities by number of Wikipedia sitelinks
  ratio_bins:                          # |log10(value_a / value_b)| intervals, easy -> hard is right -> left
    - [0.02, 0.05]
    - [0.05, 0.10]
    - [0.10, 0.20]
    - [0.20, 0.40]
    - [0.40, 1.00]
  pairs_per_bin: 100                   # per attribute per bin
  max_uses_per_entity: 3               # per attribute
  attributes:
    rivers:
      classes: [Q4022]
      property: P2043
      unit: km
      min_sitelinks: 20
      display_with: country
      plausible_range: [5, 7500]        # km
      larger: "Which river is longer?"
      smaller: "Which river is shorter?"
    cities:
      population_policy: &population_policy
        as_of: "2026-09-14"
        min_year: 2015
        max_pair_year_gap: 3
        stability_years: 3
        # Whole-entity counts only; exclude e.g. P518 (part), P1013 (criterion).
        allowed_qualifiers: [P585, P459, P1480, P805]
      classes: [Q515, Q1549591, Q5119, Q1637706, Q174844]
      property: P1082
      unit: null
      min_sitelinks: 40
      display_with: country
      plausible_range: [20000, 40000000]
      larger: "Using the population figures for the years indicated, which city has the larger population?"
      smaller: "Using the population figures for the years indicated, which city has the smaller population?"
    countries:
      population_policy: *population_policy
      classes: [Q6256, Q3624078]
      property: P1082
      unit: null
      min_sitelinks: 30
      max_uses_per_entity: 8       # only ~210 countries exist; allow more reuse
      display_with: null
      plausible_range: [500, 2000000000]
      larger: "Using the population figures for the years indicated, which country has the larger population?"
      smaller: "Using the population figures for the years indicated, which country has the smaller population?"
    mountains:
      classes: [Q8502]
      property: P2044
      unit: m
      min_sitelinks: 20
      display_with: country
      plausible_range: [100, 9000]      # m
      larger: "Which mountain has the higher summit elevation?"
      smaller: "Which mountain has the lower summit elevation?"
    buildings:
      classes: [Q11303, Q12518]
      property: P2048
      unit: m
      min_sitelinks: 10
      display_with: admin
      plausible_range: [30, 1000]       # m
      larger: "Which building is taller?"
      smaller: "Which building is shorter?"
    stadiums:
      classes: [Q483110, Q1154710]
      property: P1083
      unit: null
      min_sitelinks: 15
      display_with: admin
      plausible_range: [2000, 200000]
      larger: "Which stadium has the larger seating capacity?"
      smaller: "Which stadium has the smaller seating capacity?"

splits:
  # `pilot` is a stratified subset of `main`, so pilot traces are reusable.
  main:
    strategyqa: 300
    prontoqa: 300
    comparison: 300
  pilot:
    strategyqa: 30
    prontoqa: 30
    comparison: 30
